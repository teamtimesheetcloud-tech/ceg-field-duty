<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CEG Field Duty</title>
<meta name="theme-color" content="#115FA0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CEG Duty">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* CEG Field Duty – Cloud Energi brand: blue #115FA0, green #69BD45 */
:root {
  --bg: #F2F6FA; --surface: #FFFFFF; --sunk: #E8EEF4; --ink: #10233A; --muted: #5A6B7F; --line: #D7E0E9;
  --blue: #115FA0; --blue-deep: #0B4477; --blue-soft: #E2ECF6; --green: #3F8F27; --green-soft: #E6F4DE; --brand-green: #69BD45;
  --amber: #B97A06; --amber-soft: #FBF0D9; --red: #C3352B; --red-soft: #FBE4E1; --on-accent: #FFFFFF;
  --f-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 8px; color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0C1520; --surface: #142131; --sunk: #0F1A27; --ink: #E4ECF5; --muted: #93A4B8; --line: #253649;
  --blue: #6AA9DE; --blue-deep: #0E2A47; --blue-soft: #15314C; --green: #7FCB5E; --green-soft: #1C3517;
  --amber: #E6AE45; --amber-soft: #3A2D12; --red: #EF7166; --red-soft: #3E1D1B; --on-accent: #08121D; color-scheme: dark } }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
img { max-width: 100%; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.narrow { max-width: 560px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: .01em; }
h2 { font-size: 1.25rem; } h3 { font-size: 1.05rem; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
.mono { font-family: var(--f-mono); font-size: .86em; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: .85rem; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.top { background: #FFFFFF; color: #10233A; border-bottom: 3px solid #69BD45; }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo { height: 30px; width: auto; display: block; }
.brand .sep { width: 1px; align-self: stretch; background: #D7E0E9; }
.brand h1 { font-size: 1.25rem; line-height: 1.05; color: #115FA0; }
.brand p { font-size: .78rem; color: #5A6B7F; }
.acct { display: flex; align-items: center; gap: 8px; }
.acct .who { text-align: right; font-size: .82rem; line-height: 1.2; color: #10233A; }
.acct .who span { color: #5A6B7F; display: block; }
.acct button { border: 1px solid #C9D6E3; background: #fff; color: #10233A; border-radius: var(--r); padding: 6px 10px; font-weight: 600; cursor: pointer; }
.tabsbar { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.tabs { display: flex; gap: 2px; overflow-x: auto; }
.tab { border: 0; background: none; padding: 12px 14px 9px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--blue); border-bottom-color: var(--brand-green); }
.badge { display: inline-block; min-width: 20px; text-align: center; font-family: var(--f-mono); font-size: .72rem; background: var(--red); color: #fff; border-radius: 10px; padding: 1px 6px; margin-left: 4px; }
#busy { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #115FA0, #69BD45, #115FA0); background-size: 200% 100%; animation: slide 1s linear infinite; z-index: 60; }
@keyframes slide { from { background-position: 0 0; } to { background-position: 200% 0; } }
@media (prefers-reduced-motion: reduce) { #busy { animation: none; } }
body.busy main { pointer-events: none; opacity: .75; }

main { padding-block: 16px 56px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; align-items: start; }
@media (max-width: 860px) { .cols2, .cols3 { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.hl { border-color: var(--blue); }
.label { font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: var(--r); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--blue); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: var(--on-accent); }
.btn.go { background: var(--green); border-color: var(--green); color: var(--on-accent); }
.btn.danger { color: var(--red); }
.btn.danger.arm { background: var(--red); color: #fff; border-color: var(--red); }
.btn.sm { padding: 5px 10px; font-size: .85rem; }
.btn.block { width: 100%; justify-content: center; padding: 12px; font-size: 1rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; min-width: 0; }
textarea { resize: vertical; min-height: 70px; width: 100%; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: .74rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid2 .full { grid-column: 1 / -1; }
@media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }
.form-inline { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.form-inline .field { flex: 1 1 140px; }
.pill { display: inline-block; font-size: .7rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; padding: 2px 8px; border-radius: 20px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill.blue { background: var(--blue-soft); color: var(--blue); } .pill.green { background: var(--green-soft); color: var(--green); }
.pill.amber { background: var(--amber-soft); color: var(--amber); } .pill.red { background: var(--red-soft); color: var(--red); }
.tag { display: inline-block; font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #0B2E12; background: var(--brand-green); padding: 1px 7px; border-radius: 4px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); background: var(--sunk); padding: 8px 10px; white-space: nowrap; }
td { padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: middle; }
td.num, th.num { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
tr.off td { color: var(--muted); }
tfoot td { font-weight: 600; background: var(--sunk); }
td input, td select { padding: 5px 8px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px 16px; }
.kv div b { display: block; font-weight: 600; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; }
@media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, minmax(0,1fr)); } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.tile b { display: block; font-family: var(--f-display); font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.tile span { font-size: .78rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.tile.alert b { color: var(--red); }
.zone { display: flex; flex-direction: column; gap: 8px; }
.zone > h3 { font-size: .95rem; text-transform: uppercase; letter-spacing: .08em; color: var(--blue); }
.slot { display: grid; grid-template-columns: 150px minmax(0,1fr); gap: 4px 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); align-items: center; }
.slot .nm { font-weight: 600; display: flex; flex-direction: column; gap: 3px; align-items: flex-start; }
.slot .sites { grid-column: 1 / -1; font-size: .82rem; color: var(--muted); overflow-wrap: anywhere; }
.slot.empty .who { color: var(--muted); font-style: italic; }
@media (max-width: 480px) { .slot { grid-template-columns: 1fr; } }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 20px; padding: 6px 12px; cursor: pointer; font-weight: 500; font-size: .9rem; }
.chip[aria-pressed="true"] { background: var(--amber-soft); border-color: var(--amber); color: var(--amber); }
.chip.lock { cursor: default; background: var(--sunk); color: var(--muted); }
.err { color: var(--red); font-size: .88rem; }
.errs { background: var(--red-soft); color: var(--red); border-radius: var(--r); padding: 10px 14px; font-size: .9rem; }
.errs ul { margin: 4px 0 0; padding-left: 18px; }
.ok { background: var(--green-soft); color: var(--green); border-radius: var(--r); padding: 10px 14px; font-size: .9rem; }
.note { background: var(--blue-soft); color: var(--ink); border-radius: var(--r); padding: 10px 14px; font-size: .9rem; }
.empty { color: var(--muted); padding: 8px 0; }
.item { display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); }
.item:first-of-type { border-top: 0; padding-top: 0; }
.phone-hero { background: linear-gradient(135deg, #115FA0 0%, #0B4477 100%); color: #fff; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.phone-hero .pill { background: rgba(255,255,255,.15); color: #fff; }
.phone-hero h2 { color: #fff; font-size: 1.5rem; }
.phone-hero .sub { color: #C9DCEE; font-size: .9rem; }
.visit { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.visit:first-child { border-top: 0; }
.visit .done { color: var(--green); font-weight: 600; font-size: .88rem; text-align: right; }
.datelist { display: flex; flex-wrap: wrap; gap: 6px; }
.mbar { display: inline-block; width: 90px; height: 8px; background: var(--sunk); border-radius: 4px; overflow: hidden; vertical-align: middle; flex: none; }
.mbar > span { display: block; height: 100%; border-radius: 4px; }
.score { font-family: var(--f-display); font-size: 3.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.wd { font-size: .82rem; color: var(--muted); max-width: 260px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg label { flex: 1; display: flex; gap: 8px; align-items: center; justify-content: center; padding: 9px; cursor: pointer; font-weight: 600; }
.seg label + label { border-left: 1px solid var(--line); }
.seg label:has(input:checked) { background: var(--blue-soft); color: var(--blue); }
.threadhead { all: unset; box-sizing: border-box; width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer; }
.threadhead:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.msgs { display: flex; flex-direction: column; gap: 8px; }
.msg { background: var(--sunk); border-radius: 10px; padding: 8px 12px; max-width: 90%; }
.msg.me { background: var(--blue-soft); align-self: flex-end; }
dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(460px, calc(100vw - 24px)); background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgba(8, 18, 30, .6); }
.dlg { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
#qrReader { width: 100%; min-height: 240px; background: #0b1622; border-radius: 10px; overflow: hidden; }
#qrReader video { width: 100% !important; border-radius: 10px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: var(--r); font-weight: 500; z-index: 70; max-width: calc(100vw - 32px); }
.toast.bad { background: var(--red); color: #fff; }
/* login */
.login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: linear-gradient(160deg, #FFFFFF 0%, #EAF2F9 60%, #E6F4DE 100%); }
.login .box { width: min(400px, 100%); background: #fff; color: #10233A; border-radius: 14px; border: 1px solid #D7E0E9; padding: 26px 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 12px 40px rgba(17,95,160,.12); }
.login .box input { background: #fff; color: #10233A; border-color: #C9D6E3; font-size: 1.05rem; padding: 11px 12px; }
.login .box h1 { color: #115FA0; font-size: 1.6rem; }
/* QR print */
.qrgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.qrcard { border: 2px solid #115FA0; border-radius: 10px; padding: 12px; background: #fff; color: #10233A; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; break-inside: avoid; }
.qrcard .qrbox img, .qrcard .qrbox canvas { width: 160px; height: 160px; }
.qrcard b { font-size: 1.05rem; }
@media print {
  .top, .tabsbar, .noprint, footer { display: none !important; }
  body { background: #fff; }
  main { padding: 0; }
  .qrgrid { grid-template-columns: repeat(3, 1fr); }
}
footer.foot { padding-block: 0 30px; font-size: .8rem; color: var(--muted); }
</style>
</head>
<body>
<div id="busy" hidden></div>

<section class="login" id="loginView" hidden>
  <form class="box" id="fLogin">
    <img src="logo.png" alt="Cloud Energi" style="height:40px;width:auto;align-self:flex-start">
    <div><h1>CEG Field Duty</h1><p class="small" style="color:#5A6B7F">Duty roster · Site check-in · Timesheet</p></div>
    <label class="field"><span>Mobile number</span><input id="lgMobile" inputmode="tel" autocomplete="tel" placeholder="05X XXX XXXX" required></label>
    <label class="field"><span>4-digit PIN</span><input id="lgPin" type="password" inputmode="numeric" maxlength="4" pattern="\d{4}" autocomplete="current-password" placeholder="••••" required></label>
    <p class="err" id="lgErr" hidden></p>
    <button class="btn primary block">Log in</button>
    <p class="small" style="color:#5A6B7F">Your phone is registered on first login. Logging in from another phone needs the Engineer's approval.</p>
  </form>
</section>

<div id="appView" hidden>
  <header class="top">
    <div class="wrap">
      <div class="brand"><img class="logo" src="logo.png" alt="Cloud Energi"><span class="sep" aria-hidden="true"></span><div><h1>CEG Field Duty</h1><p id="roleLine"></p></div></div>
      <div class="acct"><div class="who" id="whoBox"></div><button data-act="account">Account</button></div>
    </div>
  </header>
  <div class="tabsbar"><div class="wrap"><nav class="tabs" id="tabs" role="tablist"></nav></div></div>
  <main class="wrap" id="main"></main>
  <footer class="wrap foot noprint">Cloud Energi Gas LLC · CEG Field Duty · <span id="syncInfo"></span> <button class="btn sm" data-act="refresh">Refresh</button></footer>
</div>

<dialog id="dScan"><div class="dlg" id="dScanBody"></div></dialog>
<dialog id="dAcct"><div class="dlg" id="dAcctBody"></div></dialog>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="lib/html5-qrcode.min.js"></script>
<script src="lib/qrcode.min.js"></script>
<script src="lib/xlsx.full.min.js"></script>
<script>
(function () {
  "use strict";
  /* ================= basics ================= */
  const API = (window.CFD_API || "").trim().replace(/\/macros\/u\/\d+\/s\//, "/macros/s/").replace(/\/(dev|exec)\/?(\?.*)?$/, "/exec");
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const pad = (n) => String(n).padStart(2, "0");
  const iso = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
  const fmtD = (s, o) => s ? parse(s).toLocaleDateString("en-GB", o || { weekday: "short", day: "numeric", month: "short" }) : "—";
  const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
  const localDT = (d) => iso(d) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
  const hoursBetween = (a, b) => { const [h1, m1] = a.split(":").map(Number), [h2, m2] = b.split(":").map(Number); let d = (h2 * 60 + m2) - (h1 * 60 + m1); if (d < 0) d += 1440; return d / 60; };
  const r2 = (n) => Math.round(n * 100) / 100;
  const fmtH = (n) => (n ? r2(n) : 0).toString();
  const dt = (s) => String(s || "").replace("T", " ").slice(0, 16);
  const LS = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };
  function toast(msg, bad) { const t = $("#toast"); t.textContent = msg; t.className = "toast" + (bad ? " bad" : ""); t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 3200); }

  let deviceId = LS.get("cfd.device");
  if (!deviceId) { deviceId = (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2))); LS.set("cfd.device", deviceId); }
  let token = LS.get("cfd.token") || "";
  const isMobile = (navigator.userAgentData && typeof navigator.userAgentData.mobile === "boolean") ? navigator.userAgentData.mobile : /Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
  let ip = "";
  (async () => { try { const c = new AbortController(); setTimeout(() => c.abort(), 4000); const r = await fetch("https://api.ipify.org?format=json", { signal: c.signal }); ip = (await r.json()).ip || ""; } catch (e) {} })();

  let S = null, viewer = null, lastSync = null;
  let busyCount = 0;
  function busy(on) { busyCount += on ? 1 : -1; const b = busyCount > 0; $("#busy").hidden = !b; document.body.classList.toggle("busy", b); }
  async function call(action, extra) {
    if (!API || API.indexOf("http") !== 0) throw new Error("App is not configured: set the API link in config.js.");
    const body = JSON.stringify(Object.assign({ action, token, deviceId, ip, mob: isMobile }, extra || {}));
    const res = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body, redirect: "follow" });
    if (!res.ok) throw new Error("Network error (" + res.status + "). Check your connection.");
    const text = await res.text();
    try { return JSON.parse(text); }
    catch (e) {
      if (/API is running/.test(text)) throw new Error("The server link in config.js is not the Web app /exec link, or the request was redirected. Copy the link again from Apps Script → Deploy → Manage deployments.");
      if (/<html|<!DOCTYPE/i.test(text)) throw new Error("The server asked for a Google sign-in. In Apps Script → Deploy → Manage deployments, set 'Who has access' to Anyone.");
      throw new Error("Unexpected reply from the server. Please contact the Engineer.");
    }
  }
  async function api(action, payload, opt) {
    opt = opt || {};
    busy(true);
    try {
      const r = await call(action, { payload: payload || {} });
      if (!r.ok) {
        if (r.session) { logoutLocal(r.error); return null; }
        if (!opt.quietError) toast(r.error, true);
        return r;
      }
      applyState(r.state);
      if (r.msg && !opt.silent) toast(r.msg);
      return r;
    } catch (e) { if (!opt.quietError) toast(e.message || "Could not reach the server.", true); return { ok: false, error: e.message || "Could not reach the server." }; }
    finally { busy(false); }
  }
  function applyState(st) { S = st; viewer = st.me; lastSync = new Date(); render(); }

  /* ================= login ================= */
  function showLogin(msg) {
    $("#appView").hidden = true; $("#loginView").hidden = false;
    if (msg) { $("#lgErr").textContent = msg; $("#lgErr").hidden = false; }
  }
  function logoutLocal(msg) { token = ""; LS.del("cfd.token"); S = null; showLogin(msg); }

    const d = dutyOf(tech, date);

  }
  function kpi(tech, month) {

  function teamKpi(list, month) {

  const bar = (v, color) => `<span class="mbar"><span style="width:${Math.round(Math.max(0, Math.min(1, v)) * 100)}%;background:var(${color || "--brand-green"})"></span></span>`;
  const KPI_NOTE = () => `<p class="small muted">Score = ${S.kpiW.site}% site visits (assigned sites visited, daily average) + ${S.kpiW.job}% job closure (jobs completed ÷ jobs assigned this month) + ${S.kpiW.drive}% driving (km vs. highest in team). If no jobs were assigned, the other two are scaled up. Passenger days count no km.</p>`;
  function supWorkDays(id, month) {
    const [y, m] = month.split("-").map(Number); const last = month + "-" + pad(new Date(y, m, 0).getDate());

  function supKpi(id, month) {

  function sheetTable(tech, month) {

    return `<div class="stack"><div class="row between"><h2>Timesheets</h2><div class="row">
      <label class="field"><span>Person</span><select id="tsTech">${people.map((t) => `<option value="${t.id}" ${t.id === ui.tsTech ? "selected" : ""}>${esc(t.name)}</option>`).join("")}</select></label>
      <label class="field"><span>Month</span><input type="month" id="tsMonth" value="${ui.tsMonth}" max="${TODAY().slice(0, 7)}"></label>
      <button class="btn" data-act="xlsOne">Export Excel</button><button class="btn" data-act="xlsAll">Export all (one file)</button></div></div>${user(ui.tsTech)?.role === "supervisor" ? supSheet(ui.tsTech, ui.tsMonth) : sheetTable(ui.tsTech, ui.tsMonth)}
      <p class="small muted">The app keeps the last ${100} days on screen. Older data stays in the Google Sheet.</p></div>`;
  }
  function supKpiHTML(list, month, editable) {
    const T = S.supTarget || 8;
    return `<div class="row between"><h3>Supervisors</h3>${editable ? "" : `<span class="pill blue">Target ${T} sites / day · Mon–Sat</span>`}</div>
      <div class="tablewrap"><table><thead><tr><th>Supervisor</th><th>Score</th><th>Own site visits · ${S.supW.own}%</th><th>Team KPI · ${S.supW.team}%</th><th class="num">Avg sites / day</th><th class="num">Days target met</th><th class="num">Days with no visit</th><th class="num">Wrong loc.</th></tr></thead><tbody>
      ${list.map((u) => { const k = supKpi(u.id, month); const r = rating(k.score); return `<tr><td><b>${esc(u.name)}</b></td><td>${k.score == null ? '<span class="muted">—</span>' : `<span class="mono">${k.score}</span> <span class="pill ${r[0]}">${r[1]}</span>`}</td><td><span class="row" style="gap:8px;flex-wrap:nowrap">${bar((k.own ?? 0) / 100, "--blue")}<span class="mono">${k.own ?? "—"}</span></span></td><td><span class="row" style="gap:8px;flex-wrap:nowrap">${bar((k.team ?? 0) / 100)}<span class="mono">${k.team ?? "—"}</span></span></td><td class="num">${k.avg}/${T}</td><td class="num">${k.met}/${k.days}</td><td class="num">${k.zero ? `<span class="pill red">${k.zero}</span>` : "0"}</td><td class="num">${k.wrong ? `<span class="pill red">${k.wrong}</span>` : "0"}</td></tr>`; }).join("")}
      </tbody></table></div><p class="small muted">Supervisor score = ${S.supW.own}% own site visits + ${S.supW.team}% average KPI of his technicians. Own site visits = average per working day (Mon–Sat) of sites scanned ÷ ${T}, capped at 100%; a working day with no visits counts as 0.</p>`;
  }
  function kpiTableHTML(list, month) {
    const rows = teamKpi(list, month);
    return `<div class="tablewrap"><table><thead><tr><th>Technician</th><th>Score</th><th>Site visits</th><th>Job closure</th><th class="num">Km driven</th><th class="num">Driving days</th><th class="num">Work entries</th><th class="num">Duty days</th><th class="num">OT h</th><th class="num">Wrong loc.</th></tr></thead><tbody>
      ${rows.map(({ t, k, score }) => { const r = rating(score); return `<tr><td><b>${esc(t.name)}</b></td><td>${score == null ? '<span class="muted">—</span>' : `<span class="mono">${score}</span> <span class="pill ${r[0]}">${r[1]}</span>`}</td><td><span class="row" style="gap:8px;flex-wrap:nowrap">${bar(k.coverage)}<span class="mono">${Math.round(k.coverage * 100)}%</span></span></td><td>${k.jobRate == null ? '<span class="muted small">No jobs</span>' : `<span class="row" style="gap:8px;flex-wrap:nowrap">${bar(k.jobRate, "--amber")}<span class="mono">${k.jobsDone}/${k.jobsTotal}</span></span>`}</td><td class="num">${k.km}</td><td class="num">${k.drivingDays}</td><td class="num">${k.workEntries}</td><td class="num">${k.days}</td><td class="num">${fmtH(k.ot)}</td><td class="num">${k.wrong ? `<span class="pill red">${k.wrong}</span>` : "0"}</td></tr>`; }).join("")}
      </tbody></table></div>${KPI_NOTE()}`;
  }
  function engKpi() {
    ui.kpiMonth = ui.kpiMonth || TODAY().slice(0, 7);
    return `<div class="stack"><div class="row between"><h2>KPI</h2><label class="field"><span>Month</span><input type="month" id="kpiMonth" value="${ui.kpiMonth}" max="${TODAY().slice(0, 7)}"></label></div>
      <section class="card">${supKpiHTML(sups(), ui.kpiMonth, true)}</section>
      <section class="card"><h3>Technicians</h3>${kpiTableHTML(techs(), ui.kpiMonth)}</section>
      <form class="card" id="fKpiSet"><h3>KPI settings</h3><div class="form-inline">
        <label class="field"><span>Site visits %</span><input type="number" id="wSite" min="0" max="100" value="${S.kpiW.site}"></label>
        <label class="field"><span>Job closure %</span><input type="number" id="wJob" min="0" max="100" value="${S.kpiW.job}"></label>
        <label class="field"><span>Driving %</span><input type="number" id="wDrive" min="0" max="100" value="${S.kpiW.drive}"></label>
        <label class="field"><span>Supervisor target (sites/day)</span><input type="number" id="wTarget" min="1" max="40" value="${S.supTarget}"></label>
        <label class="field"><span>Supervisor: own visits %</span><input type="number" id="wOwn" min="0" max="100" value="${S.supW.own}"></label>
        <label class="field"><span>Supervisor: team KPI %</span><input type="number" id="wTeam" min="0" max="100" value="${S.supW.team}"></label>
        <button class="btn primary">Save settings</button></div></form></div>`;
  }
  function engLogs() { return `<section class="card"><h2>Activity log</h2><p class="small muted">Wrong-location attempts, phone and login history, approvals.</p>${S.logs.map(logRow).join("") || '<p class="empty">No entries.</p>'}</section>`; }

  /* ================= jobs & messages ================= */
  const JST = { open: ["blue", "Open"], pending_sup: ["amber", "With supervisor"], pending_eng: ["amber", "With engineer"], closed: ["green", "Closed"] };
  function jobItem(j, mode) {
    const st = JST[j.status] || ["", j.status]; const late = j.status === "open" && j.due && j.due < TODAY();
    let act = "";
    if (mode === "tech" && j.status === "open") act = `<div class="form-inline"><input placeholder="What was done (required)" data-jnote="${j.id}" aria-label="Completion note"><button class="btn sm go" data-act="jobDone" data-id="${j.id}">Mark complete</button></div>`;
    if (mode === "sup" || mode === "eng") act = decideBtns("job", j.id, mode);
    if (mode === "view" && j.status === "open" && (j.by === viewer || me().role === "engineer")) act = `<div><button class="btn sm danger" data-act="jobCancel" data-id="${j.id}">Cancel job</button></div>`;
    return `<div class="item"><div class="row between"><span><span class="mono muted">${esc(j.no)}</span> · <b>${esc(site(j.site)?.name)}</b> <span class="small muted">${esc(site(j.site)?.area)}</span></span><span class="row">${late ? '<span class="pill red">Overdue</span>' : ""}<span class="pill ${st[0]}">${st[1]}</span></span></div>
      <div>${esc(j.desc)}</div>
      <div class="small muted">To ${esc(nm(j.assignee))} · from ${esc(nm(j.by))}${j.due ? " · due " + fmtD(j.due) : ""}</div>
      ${j.note ? `<div class="small"><b>Done:</b> ${esc(j.note)}</div>` : ""}
      ${j.returnComment && j.status === "open" ? `<div class="errs">Returned: ${esc(j.returnComment)}</div>` : ""}${act}</div>`;
  }
  function openJobsCard() {
    const mine = S.jobs.filter((j) => j.assignee === viewer && j.status === "open");
    if (!mine.length) return "";
    return `<section class="card hl"><h2>Jobs assigned to me (${mine.length})</h2>${mine.map((j) => jobItem(j, "tech")).join("")}</section>`;
  }
  function techJobs() {
    const mine = S.jobs.filter((j) => j.assignee === viewer).sort((a, b) => (a.status === "open" ? 0 : 1) - (b.status === "open" ? 0 : 1) || b.created.localeCompare(a.created));
    return `<div class="stack narrow"><section class="card"><h2>My jobs</h2><p class="small muted">When you mark a job complete it goes to your supervisor, then to the Engineer.</p>${mine.length ? mine.map((j) => jobItem(j, "tech")).join("") : '<p class="empty">No jobs assigned.</p>'}</section></div>`;
  }
  function jobsAdmin() {
    const isEng = me().role === "engineer";
    const people = isEng ? [...sups(), ...techs()] : techs(viewer);
    const ids = people.map((p) => p.id);
    let list = S.jobs.filter((j) => isEng || j.by === viewer || ids.includes(j.assignee)).sort((a, b) => b.created.localeCompare(a.created));
    if (ui.jobFilter === "active") list = list.filter((j) => j.status !== "closed"); else if (ui.jobFilter === "closed") list = list.filter((j) => j.status === "closed");
    const grp = (label, arr) => arr.length ? `<optgroup label="${label}">${arr.map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join("")}</optgroup>` : "";
    const slotsForSites = isEng ? S.slots : supSlots(viewer);
    return `<div class="cols2"><form class="card" id="fJob"><h2>Assign a job</h2>
        <label class="field"><span>Assign to</span><select id="jbWho" required><option value="">Select person</option>${isEng ? grp("Supervisors", sups()) : ""}${grp("Technicians", isEng ? techs() : techs(viewer))}</select></label>
        <label class="field"><span>Site</span><select id="jbSite" required><option value="">Select site</option>${slotsForSites.filter((s) => s.sites.length && s.shift !== "Night").map((s) => `<optgroup label="${esc(s.tag || s.name)}">${s.sites.map((x) => `<option value="${x}">${esc(site(x)?.name)}</option>`).join("")}</optgroup>`).join("")}</select></label>
        <label class="field"><span>Job description</span><textarea id="jbDesc" required placeholder="e.g. Replace breakaway coupling on Line 1 and leak test"></textarea></label>
        <label class="field"><span>Due date (optional)</span><input type="date" id="jbDue" min="${TODAY()}"></label>
        <button class="btn primary">Assign job</button>
        <p class="small muted">Flow: assigned → completed → supervisor approves → Engineer closes.</p></form>
      <section class="card"><div class="row between"><h2>Jobs</h2><select id="jobFilter" aria-label="Filter"><option value="active" ${ui.jobFilter === "active" ? "selected" : ""}>Active</option><option value="closed" ${ui.jobFilter === "closed" ? "selected" : ""}>Closed</option><option value="all" ${ui.jobFilter === "all" ? "selected" : ""}>All</option></select></div>
        ${list.length ? list.map((j) => jobItem(j, "view")).join("") : '<p class="empty">No jobs.</p>'}</section></div>`;
  }
  function messagesView() {
    const u = me();
    const mine = S.threads.slice().sort((a, b) => b.msgs[b.msgs.length - 1].at.localeCompare(a.msgs[a.msgs.length - 1].at));
    let opts;
    if (u.role === "technician") opts = `${u.sup ? `<option value="${u.sup}">My supervisor – ${esc(nm(u.sup))}</option>` : ""}<option value="${engId()}">Engineer – ${esc(nm(engId()))}</option>${u.sup ? `<option value="${u.sup},${engId()}">Both</option>` : ""}`;
    else if (u.role === "supervisor") opts = `<option value="${engId()}">Engineer – ${esc(nm(engId()))}</option>${techs(viewer).map((t) => `<option value="${t.id}">${esc(t.name)}</option>`).join("")}`;
    else opts = S.users.filter((x) => x.id !== viewer).map((x) => `<option value="${x.id}">${esc(x.name)}</option>`).join("");
    const thread = (t) => {
      const open = ui.openThread === t.id; const last = t.msgs[t.msgs.length - 1]; const unread = t.unread.includes(viewer);
      const who = [t.from, ...t.to].filter((x) => x !== viewer).map(nm).join(", ");
      return `<div class="item"><button class="threadhead" data-act="openThread" data-id="${t.id}" aria-expanded="${open}"><span><b>${esc(t.subject || "(no subject)")}</b>${unread ? ' <span class="pill red">New</span>' : ""}<br><span class="small muted">With ${esc(who)} · ${dt(last.at)}</span></span><span class="muted">${open ? "▲" : "▼"}</span></button>
        ${open ? `<div class="msgs">${t.msgs.map((m) => `<div class="msg${m.by === viewer ? " me" : ""}"><span class="small muted">${esc(nm(m.by))} · ${dt(m.at)}</span><div>${esc(m.text)}</div></div>`).join("")}</div>
          <form class="form-inline" data-reply="${t.id}"><input required placeholder="Write a reply" aria-label="Reply" style="flex:1 1 200px"><button class="btn primary">Send</button></form>` : `<div class="small muted">${esc(last.text.slice(0, 120))}</div>`}</div>`;
    };
    return `<div class="cols2"><form class="card" id="fMsg"><h2>New message</h2>
        <label class="field"><span>To</span><select id="msgTo" required>${opts}</select></label>
        <label class="field"><span>Subject</span><input id="msgSub" placeholder="e.g. Spare parts needed at KHK"></label>
        <label class="field"><span>Message</span><textarea id="msgText" required placeholder="Write your comment"></textarea></label>
        <button class="btn primary">Send</button></form>
      <section class="card"><h2>Conversations</h2>${mine.length ? mine.map(thread).join("") : '<p class="empty">No messages yet.</p>'}</section></div>`;
  }

  /* ================= technician ================= */
  function techToday() {
    if (me().role === "supervisor") return supToday();
    const a = myAssignment(viewer, TODAY());
    const d = openDutyOf(viewer);
    let hero;
    const shownSlot = d ? slotOf(d) : (a && a.type === "duty" ? a.slot : null);
    if (shownSlot) hero = `<div class="phone-hero"><div class="row between"><span class="pill">${fmtD(d ? d.date : TODAY(), { weekday: "long", day: "numeric", month: "short" })}</span>${a && a.fallback ? `<span class="pill">Last approved roster</span>` : ""}</div>
      <h2>${esc(shownSlot.name)} ${tagHTML(shownSlot)}</h2><p class="sub">${shownSlot.zone ? esc(zone(shownSlot.zone)?.name) + " · " : ""}${shownSlot.shift} shift ${shownSlot.shift === "Night" ? "19:00–07:00" : "07:00–19:00"} · ${shownSlot.sites.length} sites</p>
      ${a && a.monitoring ? '<p><span class="pill" style="background:#69BD45;color:#0B2E12">Monitoring in-charge today</span></p>' : ""}</div>`;
    else hero = `<div class="phone-hero"><span class="pill">${fmtD(TODAY(), { weekday: "long", day: "numeric", month: "short" })}</span><h2>${a?.type === "off" ? "Off duty today" : a?.type === "leave" ? "On leave today" : "Not on today's roster"}</h2><p class="sub">You can still record emergency duty from the Emergency tab.</p></div>`;
    hero += openJobsCard();
    if (!shownSlot) return `<div class="stack narrow">${hero}</div>`;
    if (!d) {
      return `<div class="stack narrow">${hero}<form class="card" id="fStart"><h2>Start duty</h2>
        <div class="grid2"><label class="field"><span>Start time</span><input type="time" id="dsStart" value="${nowHM()}" required></label>
        <label class="field"><span>Vehicle no.</span><input id="dsVeh" list="vehList" inputmode="numeric" maxlength="5" placeholder="5 digits" required></label>
        <div class="field full"><span>In the car today</span><div class="seg" role="radiogroup"><label><input type="radio" name="dsCar" value="drive" checked> I am driving</label><label><input type="radio" name="dsCar" value="pass"> Passenger</label></div></div>
        <label class="field full" id="kmWrap"><span>Opening km</span><input type="number" id="dsKm" inputmode="numeric" min="0" placeholder="Odometer reading"></label>
        <label class="field full" id="drvWrap" hidden><span>Driver</span><select id="dsDrv"><option value="">Select driver</option>${S.users.filter((t) => t.id !== viewer && t.role !== "engineer").map((t) => `<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select></label></div>
        <datalist id="vehList">${S.vehicles.map((v) => `<option value="${esc(v)}">`).join("")}</datalist>
        <p class="small muted">Only the driver records km. Km driven counts in the driver's KPI.</p>
        <button class="btn go block">Start duty</button></form></div>`;
    }
    const sl = shownSlot;
    const sitesHTML = sl.sites.map((sid) => { const x = site(sid); const v = d.visits.find((q) => q.site === sid);
      return `<div class="visit"><span><b>${esc(x?.name)}</b><br><span class="small muted">${esc(x?.area)}</span></span>${v ? `<span class="done">✓ ${v.time}${v.gps && v.gps !== "verified" ? '<br><span class="small muted">GPS not set</span>' : ""}</span>` : d.end ? '<span class="muted small">Not visited</span>' : `<button class="btn sm primary" data-act="scan" data-id="${sid}">Scan QR</button>`}</div>`; }).join("");
    const c = dayCalc(viewer, d.date);
    const end = d.end ? `<div class="card"><h2>Duty closed</h2><div class="kv"><div><span class="label">Hours</span><b class="mono">${fmtH(c.dutyH)} h</b></div><div><span class="label">Overtime</span><b class="mono">${fmtH(c.ot)} h</b></div><div><span class="label">Km driven</span><b class="mono">${!d.driver ? "Passenger" : c.km}</b></div><div><span class="label">Sites</span><b class="mono">${c.covN}/${c.covT}</b></div></div></div>`
      : `<form class="card" id="fEnd"><h2>End duty</h2><div class="grid2"><label class="field"><span>Closing time</span><input type="time" id="deEnd" value="${nowHM()}" required></label>${!d.driver ? `<div class="field"><span>Car</span><p class="small muted">Passenger${d.coDriver ? " with " + esc(nm(d.coDriver)) : ""}. No km needed.</p></div>` : `<label class="field"><span>Closing km</span><input type="number" id="deKm" min="${d.kmStart + 1}" required placeholder="&gt; ${d.kmStart}"></label>`}</div><p class="small muted" id="deCalc"></p><button class="btn primary block">End duty</button></form>`;
    return `<div class="stack narrow">${hero}
      <div class="card"><div class="kv"><div><span class="label">Started</span><b class="mono">${d.start}</b></div><div><span class="label">Vehicle</span><b class="mono">${esc(d.vehicle)}</b></div><div><span class="label">${!d.driver ? "Car" : "Opening km"}</span><b class="mono">${!d.driver ? "Passenger" : d.kmStart}</b></div><div><span class="label">Visited</span><b class="mono">${c.covN}/${sl.sites.length}</b></div></div></div>
      <div class="card"><h2>Site check-in</h2><p class="small muted">Scan the QR code fixed at the site. Your location must be within ${S.radius} m of the site.</p><div>${sitesHTML}</div></div>
      ${workCard(d, sl, false)}${end}</div>`;
  }
  function workCard(d, sl, isSup) {
    const mineSites = sl.sites.map(site).filter(Boolean); const others = S.sites.filter((x) => !sl.sites.includes(x.id));
    return `<form class="card" id="fWork"><h2>Work done today</h2><p class="small muted">Add maintenance or any other work. It appears in the timesheet.</p>
      <label class="field"><span>Site</span><select id="wkSite" required><option value="">Select site</option><optgroup label="${isSup ? "My team's sites" : "My sites"}">${mineSites.map((x) => `<option value="${x.id}">${esc(x.name)}</option>`).join("")}</optgroup>${others.length ? `<optgroup label="Other sites">${others.map((x) => `<option value="${x.id}">${esc(x.name)}</option>`).join("")}</optgroup>` : ""}</select></label>
      <label class="field"><span>Description</span><textarea id="wkDesc" required placeholder="e.g. Replaced solenoid valve, leak test OK"></textarea></label>
      <button class="btn primary">Add work</button>
      <div>${d && (d.work || []).length ? d.work.map((w) => `<div class="visit"><span class="small"><span class="mono muted">${w.time}</span> · <b>${esc(site(w.site)?.name)}</b><br>${esc(w.desc)}</span><button type="button" class="btn sm danger" data-act="wkDel" data-id="${w.id}">Remove</button></div>`).join("") : '<p class="empty">Nothing added yet.</p>'}</div></form>`;
  }
  function techEmergency() {
    const now = new Date(); const min = localDT(new Date(now - 72 * 3600e3)), max = localDT(now);
    const mine = S.emergencies.filter((e) => e.tech === viewer).sort((a, b) => b.start.localeCompare(a.start));
    const ed = ui.emEdit ? S.emergencies.find((e) => e.id === ui.emEdit) : null;
    const st = { pending_sup: ["amber", "With supervisor"], pending_eng: ["amber", "With engineer"], approved: ["green", "Approved · in timesheet"], returned: ["red", "Returned"] };
    return `<div class="stack narrow"><form class="card" id="fEm"><h2>${ed ? "Correct and resubmit" : "Emergency duty"}</h2>
      <p class="small muted">Enter within 72 hours of the incident. Approval: Supervisor → Engineer, then added to your timesheet.</p>
      <label class="field"><span>Site</span><select id="emSite" required><option value="">Select site</option>${S.sites.map((x) => `<option value="${x.id}" ${ed?.site === x.id ? "selected" : ""}>${esc(x.name)} · ${esc(x.area)}</option>`).join("")}</select></label>
      <div class="grid2"><label class="field"><span>Start</span><input type="datetime-local" id="emStart" min="${min}" max="${max}" value="${ed ? ed.start.slice(0, 16) : ""}" required></label>
      <label class="field"><span>End</span><input type="datetime-local" id="emEnd" min="${min}" max="${max}" value="${ed ? ed.end.slice(0, 16) : ""}" required></label></div>
      <label class="field"><span>Emergency situation</span><textarea id="emDesc" required placeholder="What happened and what you did">${esc(ed?.desc || "")}</textarea></label>
      <div class="row"><button class="btn primary">${ed ? "Resubmit" : "Submit"}</button>${ed ? '<button type="button" class="btn" data-act="emCancel">Cancel</button>' : ""}</div></form>
      <section class="card"><h2>My entries</h2>${mine.length ? mine.map((e) => `<div class="item"><div class="row between"><b>${esc(site(e.site)?.name)}</b><span class="pill ${(st[e.status] || [""])[0]}">${(st[e.status] || ["", e.status])[1]}</span></div><div class="small mono">${dt(e.start)} → ${dt(e.end)}</div><div class="small">${esc(e.desc)}</div>${e.status === "returned" ? `<div class="errs">Comment: ${esc(e.comment)}</div><div><button class="btn sm" data-act="emEdit" data-id="${e.id}">Correct and resubmit</button></div>` : ""}</div>`).join("") : '<p class="empty">No emergency entries.</p>'}</section></div>`;
  }
  function leaveMin() { const t = new Date(Date.now() + 24 * 3600e3); const d = iso(t); return (t.getHours() || t.getMinutes()) ? addDays(d, 1) : d; }
  function techLeave() {
    const mine = S.leaves.filter((l) => l.tech === viewer).sort((a, b) => (b.submittedAt || "").localeCompare(a.submittedAt || ""));
    const st = { pending_sup: ["amber", "With supervisor"], pending_eng: ["amber", "With engineer"], approved: ["green", "Approved"], returned: ["red", "Returned"] };
    return `<div class="stack narrow"><form class="card" id="fLeave"><h2>Request leave</h2>
      <p class="small muted">Request at least 24 hours before the first leave day. Earliest date now: <b>${fmtD(leaveMin())}</b>.</p>

  /* ================= QR scan + GPS ================= */
  let scanner = null, scanBusy = false;
  async function stopScanner() { if (scanner) { try { await scanner.stop(); } catch (e) {} try { scanner.clear(); } catch (e) {} scanner = null; } }
  function scanMsg(html) { const el = $("#scanStatus"); if (el) el.innerHTML = html; }
  async function openScan(siteId) {
    const x = site(siteId); scanBusy = false;
    $("#dScanBody").innerHTML = `<div class="row between"><h2>Scan site QR</h2><button class="btn sm" data-act="closeScan" aria-label="Close">✕</button></div>
      <p class="small muted">Point the camera at the QR code at <b>${esc(x.name)}</b>.</p><div id="qrReader"></div><div id="scanStatus" class="small"></div>`;
    $("#dScan").showModal();
    if (!window.Html5Qrcode) { scanMsg('<div class="errs">Scanner could not load. Check internet and reload the app.</div>'); return; }
    try {
      scanner = new Html5Qrcode("qrReader", { verbose: false });
      await scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 220, height: 220 } }, (text) => onDecoded(text, siteId), () => {});
    } catch (e) {
      scanMsg('<div class="errs">Camera not available. Allow camera access for this app in your phone settings, then try again.</div>');
    }
  }
  function getPosition() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) return reject(new Error("Location is not supported on this phone."));
      navigator.geolocation.getCurrentPosition((p) => resolve(p.coords), (err) => reject(new Error(err.code === 1 ? "Location permission denied. Allow location for this app and try again." : "Could not get your location. Move to open sky and try again.")), { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 });
    });
  }
  async function onDecoded(text, siteId) {
    if (scanBusy) return; scanBusy = true;
    await stopScanner();
    const m = String(text).match(/^CEGFD:SITE:(.+)$/);
    if (!m) { scanMsg('<div class="errs">This is not a CEG Field Duty site QR code.</div><button class="btn" data-act="rescan" data-id="' + siteId + '">Scan again</button>'); return; }
    if (m[1] !== siteId) { scanMsg(`<div class="errs">This QR code belongs to <b>${esc(site(m[1])?.name || "another site")}</b>, not ${esc(site(siteId).name)}.</div><button class="btn" data-act="rescan" data-id="${siteId}">Scan again</button>`); return; }
    scanMsg("Getting your location…");
    let c;
    try { c = await getPosition(); } catch (e) { scanMsg(`<div class="errs">${esc(e.message)}</div><button class="btn" data-act="rescan" data-id="${siteId}">Try again</button>`); return; }
    scanMsg("Checking location…");
    const r = await api("scan", { site: siteId, lat: c.latitude, lng: c.longitude, accuracy: Math.round(c.accuracy || 0) }, { quietError: true, silent: true });
    if (r && r.ok) { $("#dScan").close(); toast(r.msg); }
    else if (r) scanMsg(`<div class="errs" style="font-size:1rem"><b>${/Wrong location/.test(r.error) ? "Wrong location detected" : "Not saved"}</b><br>${esc(r.error)}</div><button class="btn block" data-act="closeScan">OK</button>`);
  }
  $("#dScan").addEventListener("close", () => { stopScanner(); });

  function sheetRowsFor(id, month) {
    const u = user(id); const [y, m] = month.split("-").map(Number); const days = new Date(y, m, 0).getDate();
    const monthLabel = new Date(y, m - 1, 1).toLocaleDateString("en-GB", { month: "long", year: "numeric" });
    const head = [["CLOUD ENERGI GAS LLC – TIME SHEET"], ["Name:", u.name, "", "Position:", u.role === "supervisor" ? "Supervisor" : "CNG Technician", "", "Contact:", u.mobile || ""], ["Month:", monthLabel], []];
    const rows = [];
    if (u.role === "supervisor") {
      rows.push(["Date", "Day", "Sites added", "Sites visited", "Scan times", "Wrong-location attempts", "Work done"]);
      supWorkDays(id, month).forEach((x) => { const d = x.rec; rows.push([x.date, parse(x.date).toLocaleDateString("en-GB", { weekday: "long" }), d ? (d.plan || []).length : 0, x.n, d ? [...d.visits].sort((a, b) => a.time.localeCompare(b.time)).map((v) => v.time + " " + (site(v.site)?.name || "")).join(", ") : "No site visit", S.logs.filter((l) => l.type === "location" && l.tech === id && l.at.slice(0, 10) === x.date).length, d ? (d.work || []).map((w) => (site(w.site)?.name || "") + ": " + w.desc).join("; ") : ""]); });
    } else {
      rows.push(["Date", "Day", "On/Off Duty", "Shift", "Area / Zone", "Start Time", "Finish Time", "Hours Worked", "Emergency Hours", "O.T", "Car", "Km Driven", "Sites Visited", "Work Done / Remarks"]);
      let tH = 0, tE = 0, tO = 0, tK = 0, tS = 0;
      for (let i = 1; i <= days; i++) {
        const date = month + "-" + pad(i); if (date > TODAY()) break;
        const a = assignmentFor(id, date); const c = dayCalc(id, date); const sl = slotOf(c.d);
        tH += c.dutyH; tE += c.emH; tO += c.ot; tK += c.km; tS += c.covN;
        rows.push([date, parse(date).toLocaleDateString("en-GB", { weekday: "long" }), c.d ? "On Duty" : a?.type === "leave" ? "Leave" : a?.type === "off" ? "Off Duty" : c.emH ? "Emergency" : "", sl ? sl.shift : "", sl ? (sl.tag || sl.name) + (sl.zone ? " · " + (zone(sl.zone)?.name || "") : "") : "", c.d?.start || "", c.d?.end || "", c.dutyH ? r2(c.dutyH) : "", c.emH ? r2(c.emH) : "", c.ot ? r2(c.ot) : "", c.d ? (c.d.driver ? "Driver" : "Passenger") : "", c.d && c.d.driver && c.d.end ? c.km : "", c.d ? (c.covT ? c.covN + "/" + c.covT : c.covN) : "", c.d ? (c.d.work || []).map((w) => (site(w.site)?.name || "") + ": " + w.desc).join("; ") : ""]);
      }
      rows.push(["Total", "", "", "", "", "", "", r2(tH), r2(tE), r2(tO), "", tK, tS, ""]);
    }
    const foot = [[], ["Submit By:", u.name, "", "Checked By:", nm(engId())], ["Comments:"]];
    return head.concat(rows, foot);
  }

    } else if (f.id === "fKpiSet") {
      const W = { site: +$("#wSite").value || 0, job: +$("#wJob").value || 0, drive: +$("#wDrive").value || 0 };
      if (W.site + W.job + W.drive !== 100) { toast("Technician weights must add up to 100.", true); return; }
      const SW = { own: +$("#wOwn").value || 0, team: +$("#wTeam").value || 0 };
      if (SW.own + SW.team !== 100) { toast("Supervisor weights must add up to 100.", true); return; }
      await api("setting", { key: "kpiW", value: W }, { silent: true });
      await api("setting", { key: "supW", value: SW }, { silent: true });
      await api("setting", { key: "supTarget", value: Math.max(1, +$("#wTarget").value || 8) });
    } else if (f.id === "fPin") {
      const r = await api("changePin", { oldPin: $("#opin").value, newPin: $("#npin").value });
      if (r && r.ok) $("#dAcct").close();
    }
  });

  /* ================= auto refresh ================= */
  setInterval(() => {
    if (!S || document.hidden || busyCount || $("#dScan").open || $("#dAcct").open) return;
    const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
    if (ui.draft && tab === "prepare") return;
    api("refresh", {}, { silent: true, quietError: true });
  }, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && S && !busyCount) api("refresh", {}, { silent: true, quietError: true }); });

  /* ================= start ================= */
  if (LS.get("cfd.mobile")) $("#lgMobile").value = LS.get("cfd.mobile");
  if (!API || API.indexOf("http") !== 0) { showLogin("App is not configured yet: the API link in config.js is empty."); }
  else if (token) {
    $("#appView").hidden = false;
    $("#main").innerHTML = '<p class="empty">Loading…</p>';
    api("refresh", {}, { silent: true, quietError: true }).then((r) => { if (!r || !r.ok) { if (!S) showLogin(r && r.error ? r.error : ""); } });
  } else showLogin("");
})();
</script>
</body>
</html>
